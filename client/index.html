<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07021A" />
    <title>Evera AI | Meet the AI that reads your health</title>
    <meta name="description" content="Upload your blood tests and Evera AI explains each result in plain language, tracks how it changes over time, and suggests what to do next." />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="preload" href="/brand/evera-wordmark.webp" as="image" />
    <!-- Preloader styles: a small static file (not an inline <style>: Vite's build fails on those on Windows) -->
    <link rel="stylesheet" href="/preloader.css" />
  </head>
  <body>
    <!-- Preloader: plain HTML/JS so it covers the page before React mounts.
         A dotted DNA helix builds bottom → top while the wordmark fills as the progress bar.
         API: window.__evera = { loading, heroReady(), handoff(points) } -->
    <div id="ev-loader" role="status" aria-live="polite">
      <div class="ev-l__bg"></div>
      <canvas aria-hidden="true"></canvas>
      <div class="ev-l__word" aria-hidden="true"><i class="ev-l__base"></i><i class="ev-l__fill"></i></div>
      <span class="ev-l__sr">Loading Evera</span>
    </div>
    <script src="/preloader.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
