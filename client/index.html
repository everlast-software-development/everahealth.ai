<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07021A" />
    <title>Evera AI | Meet the AI that reads your health</title>
    <meta name="description" content="Upload your blood tests and Evera AI explains each result in plain language, tracks how it changes over time, and suggests what to do next." />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="preload" href="/brand/evera-wordmark.webp" as="image" />
    <!-- Preloader styles: a small static file (not an inline <style>: Vite's build fails on those on Windows) -->
    <link rel="stylesheet" href="/preloader.css" />
  </head>
  <body>
    <!-- Preloader: plain HTML/JS so it covers the page before React mounts.
         A dotted DNA helix builds bottom → top while the wordmark fills as the progress bar.
         API: window.__evera = { loading, heroReady(), handoff(points) } -->
    <div id="ev-loader" role="status" aria-live="polite">
      <div class="ev-l__bg"></div>
      <canvas aria-hidden="true"></canvas>
      <div class="ev-l__word" aria-hidden="true"><i class="ev-l__base"></i><i class="ev-l__fill"></i></div>
      <span class="ev-l__sr">Loading Evera</span>
    </div>
    <script>
      (function () {
        var doc = document, html = doc.documentElement, el = doc.getElementById('ev-loader');
        var cv = el.querySelector('canvas'), word = el.querySelector('.ev-l__word'), ctx = cv.getContext('2d');        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var ev = window.__evera = window.__evera || {};
        var heroOk = false;
        ev.loading = true;
        ev.heroReady = function () { heroOk = true; };

        // While loading, nothing may move the section slider
        var KEYS = { ArrowDown: 1, ArrowUp: 1, PageDown: 1, PageUp: 1, Home: 1, End: 1, ' ': 1 };
        var block = function (e) { if (e.type !== 'keydown' || KEYS[e.key]) { e.preventDefault(); e.stopImmediatePropagation(); } };
        var opts = { capture: true, passive: false };
        ['wheel', 'touchmove', 'keydown'].forEach(function (t) { window.addEventListener(t, block, opts); });

        // Readiness: fonts (3 s cap), App mounted, hero ready. At least MIN ms, never more than MAX ms.
        var MIN = 1500, MAX = 8000, t0 = performance.now(), fontsOk = false;
        var fonts = doc.fonts && doc.fonts.ready ? doc.fonts.ready : Promise.resolve();
        Promise.race([fonts, new Promise(function (r) { setTimeout(r, 3000); })]).then(function () { fontsOk = true; });
        var appOk = function () { var root = doc.getElementById('root'); return html.classList.contains('is-f') && root && root.children.length > 0; };

        // Canvas
        var W = 0, H = 0, dpr = Math.min(2, window.devicePixelRatio || 1);
        var size = function () { W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); };
        size(); addEventListener('resize', size);

        // The helix: 34 levels, strand A lime, strand B violet, lavender rungs every other level, a head dot at the end
        var LV = 34, LIME = [202, 231, 81], VIOLET = [146, 89, 255], LAV = [188, 172, 255];
        var helix = function (time, p) {
          var hh = Math.min(H * 0.46, 400), rad = hh * 0.15, cx = W / 2, bottom = H * 0.44 + hh / 2;
          var pts = [], built = p * LV;
          for (var i = 0; i < LV; i++) {
            var vis = Math.max(0, Math.min(1, built - i));
            if (vis <= 0) break;
            var y = bottom - (i / (LV - 1)) * hh, th = i * 0.46 + time * 1.15;
            var ends = [];
            for (var s = 0; s < 2; s++) {
              var a = th + s * Math.PI, x = cx + Math.cos(a) * rad, d = (Math.sin(a) + 1) / 2;   // d: 0 back … 1 front
              ends.push([x, d]);
              pts.push({ x: x, y: y, c: s ? VIOLET : LIME, a: (0.28 + 0.72 * d) * vis, s: 1.3 + 2.3 * d, d: d });
            }
            if (i % 2 === 0) for (var k = 1; k <= 3; k++) {
              var f = k / 4, rx = ends[0][0] + (ends[1][0] - ends[0][0]) * f, rd = ends[0][1] + (ends[1][1] - ends[0][1]) * f;
              pts.push({ x: rx, y: y, c: LAV, a: (0.12 + 0.3 * rd) * vis, s: 0.9 + 0.9 * rd, d: rd });
            }
          }
          if (p > 0.96) {
            var hv = (p - 0.96) / 0.04;
            pts.push({ x: cx, y: bottom - hh - hh * 0.07, c: LAV, a: hv, s: 4.2, d: 1 });
          }
          return pts.sort(function (m, n) { return m.d - n.d; });
        };
        var paint = function (pts, scaleA) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
          for (var i = 0; i < pts.length; i++) {
            var q = pts[i], a = q.a * (scaleA == null ? 1 : scaleA);
            if (a <= 0.01) continue;
            ctx.fillStyle = 'rgba(' + q.c[0] + ',' + q.c[1] + ',' + q.c[2] + ',' + a.toFixed(3) + ')';
            ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, 6.2832); ctx.fill();
          }
        };

        var shown = 0, done = false, raf;
        var tick = function (now) {
          var el_ms = now - t0, real = (fontsOk ? 1 : 0) + (appOk() ? 1 : 0) + (heroOk ? 1 : 0);
          var goal = el_ms >= MAX ? 1 : Math.min(real / 3, el_ms / MIN);
          shown += (goal - shown) * 0.1;
          if (goal === 1 && shown > 0.995) shown = 1;
          word.style.setProperty('--p', shown.toFixed(4));
          if (!reduce) paint(helix(now / 1000, shown));
          if (shown >= 1) return finish(now / 1000);
          raf = requestAnimationFrame(tick);
        };

        var finish = function (time) {
          if (done) return; done = true;
          var pts = reduce ? [] : helix(time, 1);
          ev.loading = false;
          ['wheel', 'touchmove', 'keydown'].forEach(function (t) { window.removeEventListener(t, block, opts); });
          removeEventListener('resize', size);
          try { window.dispatchEvent(new CustomEvent('evera:loaded')); } catch (e) { /* very old browsers */ }
          var handed = false;
          if (!reduce && typeof ev.handoff === 'function') {
            try {
              ev.handoff(pts.map(function (q) { return { x: q.x, y: q.y, r: q.c[0], g: q.c[1], b: q.c[2], a: q.a, s: q.s }; }));
              handed = true;
            } catch (e) { handed = false; }
          }
          if (handed) { ctx.clearRect(0, 0, cv.width, cv.height); cv.style.display = 'none'; }
          else if (!reduce) {
            // no hero took the dots: scatter them outward and fade
            var s0 = performance.now(), cx = W / 2, cy = H * 0.44;
            var seeds = pts.map(function (q) { var ang = Math.atan2(q.y - cy, q.x - cx) + (Math.random() - 0.5) * 0.8; return [Math.cos(ang), Math.sin(ang), 120 + Math.random() * 260]; });
            var fly = function (now) {
              var k = Math.min(1, (now - s0) / 600), e = 1 - Math.pow(1 - k, 3);
              paint(pts.map(function (q, i) { return { x: q.x + seeds[i][0] * seeds[i][2] * e, y: q.y + seeds[i][1] * seeds[i][2] * e, c: q.c, a: q.a, s: q.s }; }), 1 - k);
              if (k < 1) requestAnimationFrame(fly);
            };
            requestAnimationFrame(fly);
          }
          el.classList.add('is-out');
          el.querySelector('.ev-l__sr').textContent = 'Evera is ready';
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, reduce ? 300 : 700);
        };
        raf = requestAnimationFrame(tick);
        // frames pause in a background tab: the hard limit must still hold
        setTimeout(function () { if (!done) { cancelAnimationFrame(raf); word.style.setProperty('--p', '1'); finish(performance.now() / 1000); } }, MAX + 300);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
